name: Auto-update Rivo

on:
  schedule:
    # 10:00 AM Eastern Time is 14:00 UTC (during Daylight Saving Time)
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  update-rivo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch latest release and extract files
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PKG="com.grinch.rivo4"

          # Rivo ships preview (pre-release) builds and /releases/latest skips those,
          # so take the newest non-draft release that has a foss APK.
          RELEASES=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/user-grinch/RivoPhoneApp/releases?per_page=20")

          LATEST_RELEASE=$(echo "$RELEASES" | jq -c '[.[] | select(.draft == false) | select(any(.assets[]; .name | test("foss.*\\.apk$")))] | first')
          if [ -z "$LATEST_RELEASE" ] || [ "$LATEST_RELEASE" = "null" ]; then
            echo "Error: Could not find a release with a foss APK."
            exit 1
          fi

          # Extract the version tag (strip leading 'v')
          VERSION_TAG=$(echo "$LATEST_RELEASE" | jq -r '.tag_name')
          VERSION=${VERSION_TAG#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          DOWNLOAD_URL=$(echo "$LATEST_RELEASE" | jq -r '[.assets[] | select(.name | test("foss.*\\.apk$"))][0].browser_download_url')
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Error: Could not find the release APK URL."
            exit 1
          fi

          echo "Downloading from $DOWNLOAD_URL"
          curl -sfL -o rivo.apk "$DOWNLOAD_URL"

          # Safety: refuse anything that isn't Rivo
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          GOT=$("$AAPT2" dump packagename rivo.apk)
          if [ "$GOT" != "$PKG" ]; then
            echo "Error: package is $GOT, expected $PKG"
            exit 1
          fi

          # Create target directories
          mkdir -p prebuilts/product/priv-app/RivoPhone
          mkdir -p prebuilts/product/etc/permissions

          mv rivo.apk prebuilts/product/priv-app/RivoPhone/RivoPhone.apk

          # Rivo doesn't ship a privapp XML, so generate it from the APK manifest
          PERMS=$("$AAPT2" dump permissions prebuilts/product/priv-app/RivoPhone/RivoPhone.apk \
            | sed -n "s/^uses-permission[a-z0-9-]*: name='\([^']*\)'.*/\1/p" | sort -u)
          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<permissions>'
            echo "    <privapp-permissions package=\"$PKG\">"
            while IFS= read -r p; do [ -n "$p" ] && echo "        <permission name=\"$p\"/>"; done <<< "$PERMS"
            echo '    </privapp-permissions>'
            echo '</permissions>'
          } > "prebuilts/product/etc/permissions/privapp-permissions-$PKG.xml"

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Rivo: Auto-update to version ${{ steps.update.outputs.version }}"
          file_pattern: "prebuilts/*"
