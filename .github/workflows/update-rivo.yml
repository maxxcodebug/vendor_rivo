name: Update RivoPhone

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rivo
  cancel-in-progress: false

env:
  UPSTREAM: user-grinch/RivoPhoneApp
  PKG: com.grinch.rivo4
  APK: prebuilts/product/priv-app/RivoPhone/RivoPhone.apk
  GH_TOKEN: ${{ github.token }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest upstream APK
        id: dl
        run: |
          set -euo pipefail
          json=$(gh api "repos/$UPSTREAM/releases?per_page=20")
          rel=$(echo "$json" | jq -c '[.[] | select(.draft==false) | select(any(.assets[]; .name|test("foss.*\\.apk$")))] | first')
          if [ "$rel" = "null" ]; then echo "::error::no foss APK in upstream releases"; exit 1; fi
          tag=$(echo "$rel" | jq -r .tag_name)
          asset=$(echo "$rel" | jq -r '[.assets[] | select(.name|test("foss.*\\.apk$"))][0].name')
          mkdir -p "$RUNNER_TEMP/dl"
          gh release download "$tag" -R "$UPSTREAM" -p "$asset" -D "$RUNNER_TEMP/dl" --clobber
          new="$RUNNER_TEMP/dl/$asset"
          if [ -f "$APK" ] && cmp -s "$new" "$APK"; then
            echo "Already up to date ($tag)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "new=$new" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate APK
        if: steps.dl.outputs.changed == 'true'
        env:
          NEW: ${{ steps.dl.outputs.new }}
        run: |
          set -euo pipefail
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          BT=$(dirname "$AAPT2")
          got=$("$AAPT2" dump packagename "$NEW")
          [ "$got" = "$PKG" ] || { echo "::error::package changed: $got"; exit 1; }
          "$BT/apksigner" verify --verbose "$NEW" | tee "$RUNNER_TEMP/sig.txt"
          grep -Eq "Verified using v[234] scheme.*: true" "$RUNNER_TEMP/sig.txt" || { echo "::error::no v2+ signature"; exit 1; }
          if unzip -v "$NEW" | awk '$NF ~ /\.so$/ && $2 != "Stored"' | grep -q .; then
            echo "::warning::APK has compressed native libs, preprocessed: true may break"
          fi

      - name: Apply update and push
        if: steps.dl.outputs.changed == 'true'
        env:
          NEW: ${{ steps.dl.outputs.new }}
          TAG: ${{ steps.dl.outputs.tag }}
        run: |
          set -euo pipefail
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          cp -f "$NEW" "$APK"
          perms=$("$AAPT2" dump permissions "$APK" | sed -n "s/^uses-permission[a-z0-9-]*: name='\([^']*\)'.*/\1/p" | sort -u)
          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<permissions>'
            echo "    <privapp-permissions package=\"$PKG\">"
            while IFS= read -r p; do [ -n "$p" ] && echo "        <permission name=\"$p\"/>"; done <<< "$perms"
            echo '    </privapp-permissions>'
            echo '</permissions>'
          } > "prebuilts/product/etc/permissions/privapp-permissions-$PKG.xml"
          echo "$TAG" > version.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "RivoPhone: update to $TAG"
          git push
